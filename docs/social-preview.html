<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Työmatka social preview</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: linear-gradient(135deg, #0B2A52 0%, #1565C0 70%, #1E88E5 100%);
    font-family: "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
    color: #fff; position: relative;
  }
  .text { position: absolute; left: 88px; top: 118px; width: 640px; }
  h1 { font-size: 104px; font-weight: 800; letter-spacing: -2px; margin: 0; line-height: 1; }
  .names { font-size: 34px; font-weight: 500; opacity: .85; margin: 18px 0 0; letter-spacing: .5px; }
  .tag { font-size: 30px; line-height: 1.35; margin: 42px 0 0; opacity: .95; max-width: 620px; }
  .pills { position: absolute; left: 88px; bottom: 70px; display: flex; gap: 14px; }
  .pill { font-size: 22px; font-weight: 600; padding: 10px 20px; border-radius: 999px;
          background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.45); }
  .map { position: absolute; right: 70px; top: 60px; width: 460px; height: 520px; border-radius: 28px;
         background: #F4F1EA; box-shadow: 0 24px 60px rgba(0,0,0,.35); overflow: hidden; }
  .map svg { display: block; }
  .stop { fill: #1A73E8; stroke: #fff; stroke-width: 4; }
  .num { fill: #fff; font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .home { fill: #188038; stroke: #fff; stroke-width: 4; }
  .speed { position: absolute; left: 50%; transform: translateX(-50%); top: 26px;
           background: #202124; color: #fff; font-size: 34px; font-weight: 700;
           padding: 8px 30px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
</style>
</head>
<body>
  <div class="text">
    <h1>Työmatka</h1>
    <p class="names">Work Trip · Körjournal</p>
    <p class="tag">Route, navigation and work log for drivers.<br>Open maps. No API keys. No account.</p>
  </div>
  <div class="pills">
    <span class="pill">Android</span>
    <span class="pill">OpenStreetMap</span>
    <span class="pill">GPL-3.0</span>
  </div>
  <div class="map">
    <svg width="460" height="520" viewBox="0 0 460 520">
      <g stroke="#E6E1D6" stroke-width="22" stroke-linecap="round">
        <line x1="0" y1="120" x2="460" y2="140"/>
        <line x1="60" y1="0" x2="110" y2="520"/>
        <line x1="0" y1="330" x2="460" y2="290"/>
        <line x1="300" y1="0" x2="330" y2="520"/>
        <line x1="0" y1="450" x2="460" y2="470"/>
      </g>
      <g fill="#DCE9D5">
        <rect x="150" y="160" width="120" height="100" rx="18"/>
        <rect x="350" y="330" width="90" height="110" rx="18"/>
      </g>
      <path d="M70 420 C 120 380, 120 330, 160 300 S 220 180, 300 170 S 380 230, 360 300 S 300 400, 330 460"
            fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 420 C 120 380, 120 330, 160 300 S 220 180, 300 170 S 380 230, 360 300 S 300 400, 330 460"
            fill="none" stroke="#1A73E8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="home" cx="70" cy="420" r="13"/>
      <circle class="stop" cx="160" cy="300" r="24"/><text class="num" x="160" y="300">1</text>
      <circle class="stop" cx="300" cy="170" r="24"/><text class="num" x="300" y="170">2</text>
      <circle class="stop" cx="360" cy="300" r="24"/><text class="num" x="360" y="300">3</text>
      <circle class="stop" cx="330" cy="460" r="24"/><text class="num" x="330" y="460">4</text>
    </svg>
    <div class="speed">52 km/h</div>
  </div>
</body>
</html>
