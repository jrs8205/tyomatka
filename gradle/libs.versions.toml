[versions]
aboutlibraries = "15.3.0"
agp = "8.13.2"
kotlin = "2.3.21"
# KSP versioituu 2.3-sarjasta alkaen itsenäisesti, ei enää Kotlin-parina.
ksp = "2.3.10"
# Ferrostar 0.58.0 määrää nämä: coroutines, serialization, OkHttp, Compose BOM,
# lifecycle, core-ktx ja activity-compose pidetään samoissa versioissa, ettei
# riippuvuusratkaisu nosta niitä hiljaa eri versioon kuin katalogi sanoo.
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.3.2"

coreKtx = "1.17.0"
coreSplashscreen = "1.2.0"
appcompat = "1.7.1"
activityCompose = "1.13.0"
composeBom = "2026.02.01"
lifecycle = "2.10.0"
navigationCompose = "2.8.5"
room = "2.8.4"
# 2.58+ vaatii AGP 9:n — 2.57.2 on uusin AGP 8 -yhteensopiva.
hilt = "2.57.2"
hiltNavigationCompose = "1.2.0"
datastore = "1.2.1"

# Pre-1.0-kirjasto, jonka API muuttuu julkaisujen välillä: versio lukitaan ja
# nostetaan vain erikseen testaten. Ferrostar 0.58 toimii maplibre-composen 0.13-sarjalla;
# 0.13.1 korjaa sijaintinuolen suunnan. MapLibre Native nostetaan erikseen (kartan elinkaaren kaatumiskorjaus).
ferrostar = "0.58.0"
maplibreCompose = "0.13.1"
maplibreNative = "13.7.1"
desugar = "2.1.5"

junit = "4.13.2"
sqlite-jdbc = "3.53.0.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-browser = { module = "androidx.browser:browser", version = "1.8.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

ferrostar-core = { module = "com.stadiamaps.ferrostar:core", version.ref = "ferrostar" }
ferrostar-ui-compose = { module = "com.stadiamaps.ferrostar:ui-compose", version.ref = "ferrostar" }
ferrostar-ui-maplibre = { module = "com.stadiamaps.ferrostar:ui-maplibre", version.ref = "ferrostar" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose-android", version.ref = "maplibreCompose" }
maplibre-native = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibreNative" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
